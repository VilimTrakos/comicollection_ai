<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comicollect — Redizajn Prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&family=Bangers&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Roboto', system-ui, sans-serif; background: #1D1B20; overflow: hidden; }
  .cc-screen ::-webkit-scrollbar { width: 0; height: 0; }
  .cc-screen * { scrollbar-width: none; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="figma-style/cc-data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="figma-style/cc-ui.jsx"></script>
<script type="text/babel" src="figma-style/cc-screens.jsx"></script>
<script type="text/babel" src="figma-style/cc-library.jsx"></script>
<script type="text/babel" src="figma-style/cc-screens-add.jsx"></script>
<script type="text/babel" src="figma-style/cc-screens-redesign.jsx"></script>
<script type="text/babel" src="figma-style/cc-redesign-2.jsx"></script>
<script type="text/babel" src="figma-style/cc-redesign-3.jsx"></script>
<script type="text/babel" src="figma-style/cc-redesign-4.jsx"></script>
<script type="text/babel" src="figma-style/cc-redesign-5.jsx"></script>
<script type="text/babel" src="figma-style/cc-scan-review.jsx"></script>
<script type="text/babel" src="figma-style/cc-enterprise.jsx"></script>
<script type="text/babel" src="figma-style/cc-enterprise-2.jsx"></script>
<script type="text/babel" src="figma-style/cc-enterprise-app.jsx"></script>
<script type="text/babel" src="figma-style/cc-redesign-app.jsx"></script>

<script type="text/babel">
const RPROTO_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "accent": "crvena",
  "font": "roboto",
  "showStats": true
}/*EDITMODE-END*/;

function ProtoShell() {
  const [t, setTweak] = useTweaks(RPROTO_TWEAK_DEFAULTS);
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const fit = () => setScale(Math.min(1, (window.innerHeight - 40) / 868, (window.innerWidth - 40) / 410));
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return (
    <React.Fragment>
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ transform: 'scale(' + scale + ')', transformOrigin: 'center center' }}>
          <RApp t={t} setTweak={setTweak} />
        </div>
      </div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Tema" />
        <TweakRadio label="Tema" value={t.theme} options={['dark', 'light']} onChange={v => setTweak('theme', v)} />
        <TweakRadio label="Boja" value={t.accent} options={['crvena', 'oker', 'plava']} onChange={v => setTweak('accent', v)} />
        <TweakSection label="Tipografija" />
        <TweakRadio label="Naslovi" value={t.font} options={['roboto', 'comic']} onChange={v => setTweak('font', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ProtoShell />);
</script>
</body>
</html>
