# Installed inside nginx's `http` context, normally as
# /etc/nginx/conf.d/comicollect.conf. Replace the example hostname and
# certificate paths before enabling it.

log_format comicollect_no_query
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent $request_time "$request_id"';

limit_req_zone $binary_remote_addr zone=comicollect_register:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=comicollect_login:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=comicollect_session:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=comicollect_sync:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=comicollect_connections:10m;

upstream comicollect_backend {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.comicollect.example;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.comicollect.example;
    server_tokens off;
    access_log /var/log/nginx/comicollect-access.log comicollect_no_query;
    error_log /var/log/nginx/comicollect-error.log warn;

    ssl_certificate /etc/letsencrypt/live/api.comicollect.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.comicollect.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ComicollectTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    limit_conn comicollect_connections 10;
    limit_conn_status 429;
    limit_req_status 429;
    error_page 413 = @comicollect_too_large;
    error_page 429 = @comicollect_rate_limited;
    proxy_http_version 1.1;
    proxy_hide_header Server;

    location @comicollect_too_large {
        internal;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;
        return 413 '{"code":"request_too_large","error":"Request body exceeds the edge limit","request_id":"$request_id"}';
    }

    location @comicollect_rate_limited {
        internal;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;
        return 429 '{"code":"rate_limited","error":"Too many requests","request_id":"$request_id"}';
    }

    location = /api/v1/auth/register {
        client_max_body_size 32k;
        limit_req zone=comicollect_register burst=2 nodelay;
        proxy_pass http://comicollect_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/auth/login {
        client_max_body_size 32k;
        limit_req zone=comicollect_login burst=20 nodelay;
        proxy_pass http://comicollect_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/auth/(refresh|logout)$ {
        client_max_body_size 32k;
        limit_req zone=comicollect_session burst=100 nodelay;
        proxy_pass http://comicollect_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/sync {
        client_max_body_size 1m;
        limit_req zone=comicollect_sync burst=20 nodelay;
        proxy_pass http://comicollect_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/v2/sync {
        client_max_body_size 8m;
        limit_req zone=comicollect_sync burst=20 nodelay;
        proxy_pass http://comicollect_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://comicollect_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }

    location / {
        client_max_body_size 32k;
        proxy_pass http://comicollect_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
